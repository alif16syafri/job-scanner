name: Job discovery and triage
on:
  schedule:
    - cron: '17 1,5,9,13,17,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: job-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Discover and triage
        id: discovery
        continue-on-error: true
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          set +e
          npm run discover
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" -eq 2 ]; then
            echo '::warning::Discovery completed with partial source coverage. Check the summary for source limitations or errors; results were saved.'
            exit 0
          fi
          exit "$result"
      - name: Persist history and growing source registry
        if: always() && steps.discovery.outcome != 'skipped'
        run: |
          test -f data/state.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore/update-job-discovery-history"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-report-${{ github.run_id }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
      - name: Build dashboard from saved scan
        if: always() && steps.discovery.outcome != 'skipped'
        run: npm run build:dashboard
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 7
      - name: Surface scanner failure
        if: steps.discovery.outcome == 'failure'
        run: |
          echo 'The scanner failed unexpectedly. Check discovery logs and any partial report.'
          exit 1

  publish:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages"               --jq '.artifacts[] | select(.name == "github-pages" and (.expired | not)) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::Pages artifact is not visible to the deployment job.'
          exit 1
      - name: Deploy Pages dashboard
        id: deployment
        uses: actions/deploy-pages@v4
